name: Android APK Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build app icon from repository 1.ico
        run: |
          set -e
          test -f 1.ico
          if ! command -v magick >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y imagemagick
          fi
          mkdir -p app/src/main/res/drawable-nodpi
          rm -f app/src/main/res/drawable/ic_avraham.xml
          mogrify -format png -path app/src/main/res/drawable-nodpi -resize 256x256 1.ico
          mv app/src/main/res/drawable-nodpi/1.png app/src/main/res/drawable-nodpi/ic_avraham.png
          test -s app/src/main/res/drawable-nodpi/ic_avraham.png
          file app/src/main/res/drawable-nodpi/ic_avraham.png
      - name: Verify 12,000 catalog records
        run: python3 tools/verify_catalogs.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-disabled: true

      - name: Run Android lint
        run: gradle lintRelease --no-daemon --stacktrace

      - name: Build release
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Zipalign release before signing
        run: |
          set -e
          rm -f app/build/outputs/apk/release/avraham-haivri-aligned.apk app/build/outputs/apk/release/avraham-haivri-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/avraham-haivri-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/avraham-haivri-aligned.apk

      - name: Create signing certificate and sign aligned APK
        run: |
          set -e
          PASS=avraham-offline-2026
          mkdir -p build/keys
          keytool -genkeypair -v -keystore build/keys/avraham-release.jks -alias avraham -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Avraham HaIvri, OU=Aplika, O=Aplika, L=Israel, C=IL"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks build/keys/avraham-release.jks --ks-pass pass:$PASS --ks-key-alias avraham --key-pass pass:$PASS --out app/build/outputs/apk/release/avraham-haivri-android.apk app/build/outputs/apk/release/avraham-haivri-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/avraham-haivri-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/avraham-haivri-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: avraham-haivri-android-full-signed-${{ github.run_number }}
          path: app/build/outputs/apk/release/avraham-haivri-android.apk
          if-no-files-found: error
