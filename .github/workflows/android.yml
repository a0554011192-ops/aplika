name: Android APK Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-disabled: true

      - name: Verify pure-vector icon source
        run: |
          set -e
          test -s icon/ic_avraham.svg
          test -s app/src/main/res/drawable/ic_avraham.xml
          ! find app/src/main/res -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) | grep -q .
          grep -q '<vector' app/src/main/res/drawable/ic_avraham.xml
          echo "Vector-only icon verified."

      - name: Verify catalogs
        run: python3 tools/verify_catalogs.py

      - name: Run Android lint
        run: gradle lintRelease --no-daemon --stacktrace

      - name: Build release
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Zipalign release before signing
        run: |
          set -e
          rm -f app/build/outputs/apk/release/avraham-haivri-aligned.apk app/build/outputs/apk/release/avraham-haivri-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/avraham-haivri-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/avraham-haivri-aligned.apk

      - name: Sign release (stable key when configured)
        env:
          AVRAHAM_KEYSTORE_B64: ${{ secrets.AVRAHAM_KEYSTORE_B64 }}
          AVRAHAM_KEYSTORE_PASSWORD: ${{ secrets.AVRAHAM_KEYSTORE_PASSWORD }}
          AVRAHAM_KEY_ALIAS: ${{ secrets.AVRAHAM_KEY_ALIAS }}
          AVRAHAM_KEY_PASSWORD: ${{ secrets.AVRAHAM_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p build/keys
          if [ -n "$AVRAHAM_KEYSTORE_B64" ]; then
            echo "$AVRAHAM_KEYSTORE_B64" | base64 --decode > build/keys/avraham-release.jks
            PASS="$AVRAHAM_KEYSTORE_PASSWORD"
            KEY_ALIAS="$AVRAHAM_KEY_ALIAS"
            KEY_PASS="$AVRAHAM_KEY_PASSWORD"
            echo "Using configured stable release key."
          else
            PASS="avraham-offline-2026"
            KEY_ALIAS="avraham"
            KEY_PASS="$PASS"
            keytool -genkeypair -v -keystore build/keys/avraham-release.jks -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$KEY_PASS" -dname "CN=Avraham HaIvri, OU=Aplika, O=Aplika, L=Israel, C=IL"
            echo "No stable signing secret configured; generated a temporary CI key."
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks build/keys/avraham-release.jks --ks-pass "pass:$PASS" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" --out app/build/outputs/apk/release/avraham-haivri-android.apk app/build/outputs/apk/release/avraham-haivri-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/avraham-haivri-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/avraham-haivri-android.apk
          unzip -t app/build/outputs/apk/release/avraham-haivri-android.apk >/tmp/apk-unzip-test.txt
          if unzip -Z1 app/build/outputs/apk/release/avraham-haivri-android.apk | grep -Ei '\.(png|jpg|jpeg|webp)$'; then
            echo "Unexpected raster image found inside final APK."
            exit 1
          fi
          sha256sum app/build/outputs/apk/release/avraham-haivri-android.apk

      - name: Verify installation on Android emulator
        timeout-minutes: 3
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            set -e
            adb install -r app/build/outputs/apk/release/avraham-haivri-android.apk
            adb shell pm path com.aplika.avraham
            adb shell monkey -p com.aplika.avraham 1
            sleep 3
            adb shell dumpsys package com.aplika.avraham | head -80

      - name: Package complete project source
        run: |
          set -e
          mkdir -p build/source
          rm -f build/source/aplika-full-project.zip
          zip -r build/source/aplika-full-project.zip . -x './.git/*' './app/build/*' './build/*' './.gradle/*'
          test -s build/source/aplika-full-project.zip

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: avraham-haivri-android-full-signed-${{ github.run_number }}
          path: app/build/outputs/apk/release/avraham-haivri-android.apk
          if-no-files-found: error

      - name: Upload complete project source
        uses: actions/upload-artifact@v4
        with:
          name: aplika-full-project-${{ github.run_number }}
          path: build/source/aplika-full-project.zip
          if-no-files-found: error
