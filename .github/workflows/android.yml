name: Android APK Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify 12,000 catalog records
        run: python3 tools/verify_catalogs.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-disabled: true

      - name: Build release
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Create temporary signing certificate
        run: |
          set -e
          PASS=avraham-offline-2026
          mkdir -p build/keys
          keytool -genkeypair -v -keystore build/keys/avraham-release.jks -alias avraham -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Avraham HaIvri, OU=Aplika, O=Aplika, L=Israel, C=IL"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks build/keys/avraham-release.jks --ks-pass pass:$PASS --ks-key-alias avraham --key-pass pass:$PASS --out app/build/outputs/apk/release/avraham-haivri-android.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/avraham-haivri-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: avraham-haivri-android-full-signed
          path: app/build/outputs/apk/release/avraham-haivri-android.apk
          if-no-files-found: error
