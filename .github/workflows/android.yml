name: Android APK
on: [push, workflow_dispatch]
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: { distribution: temurin, java-version: '17' }
   - uses: gradle/actions/setup-gradle@v4
     with: { gradle-version: '8.10.2' }
   - name: Build signed APK
     shell: bash
     env: { KS_PASS: ${{ secrets.APK_KEYSTORE_PASSWORD }} }
     run: |
      mkdir -p app/build/keys
      PASS="${KS_PASS:-avraham-offline-2026}"
      keytool -genkeypair -v -keystore app/build/keys/release.jks -alias avraham -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Avraham HaIvri, OU=Aplika, O=Aplika, L=Israel, C=IL"
      gradle assembleRelease
      $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks app/build/keys/release.jks --ks-pass pass:$PASS --ks-key-alias avraham --key-pass pass:$PASS --out app/build/outputs/apk/release/avraham-haivri-android-signed.apk app/build/outputs/apk/release/app-release-unsigned.apk
   - uses: actions/upload-artifact@v4
     with: { name: avraham-haivri-android-signed, path: app/build/outputs/apk/release/avraham-haivri-android-signed.apk }
